apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations: [{ name: trace_id, datasourceUid: jaeger }]
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2: { datasourceUid: loki, filterByTraceID: true, spanStartTimeShift: "-5m", spanEndTimeShift: "5m" }
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - { name: trace_id, matcherType: label, matcherRegex: trace_id, datasourceUid: jaeger, url: "$${__value.raw}" }
  - name: Alertmanager
    uid: am
    type: alertmanager
    url: http://alertmanager:9093
    jsonData: { implementation: prometheus }
