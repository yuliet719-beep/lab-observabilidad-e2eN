# Collector "agente" de la nube AWS (equivale a: aws -> ADOT sidecar/daemon en ECS)
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  resource/cloud:
    attributes:
      - { key: cloud.provider, value: aws, action: insert }
      - { key: cloud.platform, value: aws_ecs, action: insert }
      - { key: cloud.region, value: us-east-1, action: insert }
      - { key: collector.name, value: otel-aws, action: upsert }
  batch: { timeout: 1s, send_batch_size: 512 }
exporters:
  otlp/gateway:
    endpoint: otel-gateway:4317
    tls: { insecure: true }
    sending_queue: { enabled: true, queue_size: 5000 }
    retry_on_failure: { enabled: true }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, resource/cloud, batch], exporters: [otlp/gateway] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource/cloud, batch], exporters: [otlp/gateway] }
    logs:    { receivers: [otlp], processors: [memory_limiter, resource/cloud, batch], exporters: [otlp/gateway] }
